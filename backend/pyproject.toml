[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "upa-agora-api"
version = "0.1.0"
description = "Backend demonstrativo do projeto UPA Agora"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "uvicorn[standard]>=0.35,<1",
  "openai>=2,<3",
  "tzdata>=2025.1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8,<10",
  "ruff>=0.14,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# O padrão do ruff (E4/E7/E9/F — erros de verdade) mais pyupgrade e bugbear.
# Ficam de fora as regras de estilo puro, como ordenação de import: elas
# reescreveriam arquivos que ninguém está tocando e afogariam num diff de
# formatação o achado que realmente importa.
select = ["E4", "E7", "E9", "F", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Nos testes, montar datetime sem fuso é proposital: schedule.py é justamente
# quem aplica o fuso, e fixá-lo no teste esconderia o que está sendo medido.
"tests/*" = ["DTZ001"]
